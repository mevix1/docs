name: MEV-1997 exact emulator state matrix

on:
  push:
    branches:
      - transport/mev-1997-native-state-matrix-20260925
    paths:
      - .github/workflows/mev-1997-emulator-state-matrix.yml
      - .github/scripts/mev-1997-emulator-matrix.sh
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: mev-1997-emulator-state-matrix
  cancel-in-progress: true

env:
  ANDROID_USER_HOME: ${{ github.workspace }}/.android-user
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android-user/avd

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout runtime carrier
        uses: actions/checkout@v4

      - name: Set up Node 24.3
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download accepted MEV-1997 R2 build
        uses: actions/download-artifact@v4
        with:
          name: mev-1997-state-matrix-build-r2
          path: input/raw
          repository: mevix1/docs
          run-id: 36179093463
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/mev-1997-build
          ROOT=input/raw
          RESULT="$(find "$ROOT" -type f -path '*/mev-1997-build/RESULT.json' -print -quit)"
          APK="$(find "$ROOT" -type f -name 'MEV-1997-state-matrix-debug.apk' -print -quit)"
          BUNDLE="$(find "$ROOT" -type f -name 'MEV-1997-source.bundle' -print -quit)"
          test -n "$RESULT" && test -n "$APK" && test -n "$BUNDLE"
          cp "$RESULT" input/mev-1997-build/RESULT.json
          cp "$APK" input/mev-1997-build/MEV-1997-state-matrix-debug.apk
          cp "$BUNDLE" input/mev-1997-build/MEV-1997-source.bundle
          echo '7c5eda7c57d0bf86aad44ee6f7dd0c04bda87141a98b981207ec50cd426ec7aa  input/mev-1997-build/MEV-1997-state-matrix-debug.apk' | sha256sum -c -
          echo 'ea7f1f3821508e1d0b932451e5702496789acf4dfc6d84fec6e76ac57d96ee83  input/mev-1997-build/MEV-1997-source.bundle' | sha256sum -c -

      - name: Enable KVM and align Android homes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Execute affected emulator state matrix
        shell: bash
        run: bash .github/scripts/mev-1997-emulator-matrix.sh

      - name: Publish emulator state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mev-1997-emulator-state-matrix
          path: |
            out/MEV-1997-emulator-state-matrix.zip
            out/mev-1997-emulator/RESULT.json
            out/mev-1997-emulator/SHA256SUMS
            out/mev-1997-emulator/screenshots
            out/mev-1997-emulator/ui
            out/mev-1997-emulator/logcat.txt
            out/mev-1997-emulator/emulator.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Enforce affected emulator verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          result=json.load(open('out/mev-1997-emulator/RESULT.json'))
          print(json.dumps(result,indent=2,sort_keys=True))
          assert result['terminalMEV661'] is False
          raise SystemExit(0 if result['status']=='PASS_MEV_1997_EMULATOR_STATE_MATRIX' else 1)
          PY
