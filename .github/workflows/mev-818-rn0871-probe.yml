name: MEV-818 RN 0.87.1 hosted Android probe

on:
  push:
    branches:
      - transport/mev-818-rn0871-probe-20260925
    paths:
      - .github/workflows/mev-818-rn0871-probe.yml
      - .github/scripts/mev-818-rn0871-probe.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mev-818-rn0871-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact probe
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Qualify Android SDK 35 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;36.0.0'
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Run bounded exact probe
        shell: bash
        run: bash .github/scripts/mev-818-rn0871-probe.sh

      - name: Publish compact readback on isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe-results/mev-818-rn0871
          mkdir -p probe-results/mev-818-rn0871
          SRC=out/mev-818-rn0871-probe
          for file in RESULT.json SHA256SUMS environment.txt scaffold-package.json scaffold-package-lock.json scaffold-tsconfig.json scaffold-App.tsx scaffold-index.js package-summary.json npm-ls-depth0.json android-files.txt npm-view-react-native.stdout.log npm-view-react-native.stderr.log npm-view-react-native.exit npm-view-cli.stdout.log npm-view-cli.stderr.log npm-view-cli.exit cli-help.stdout.log cli-help.stderr.log cli-help.exit init.stdout.log init.stderr.log init.exit typecheck.stdout.log typecheck.stderr.log typecheck.exit bundle.stdout.log bundle.stderr.log bundle.exit android-build.stdout.log android-build.stderr.log android-build.exit NativeNeutralApp-debug.apk.sha256; do
            if [[ -f "$SRC/$file" ]]; then cp "$SRC/$file" "probe-results/mev-818-rn0871/$file"; fi
          done
          if [[ -f "$SRC/scaffold-android-source.tar.gz" ]]; then
            base64 -w 0 "$SRC/scaffold-android-source.tar.gz" > probe-results/mev-818-rn0871/scaffold-android-source.tar.gz.b64
          fi
          if [[ -f out/MEV-818-rn0871-hosted-probe.zip ]]; then
            sha256sum out/MEV-818-rn0871-hosted-probe.zip > probe-results/mev-818-rn0871/evidence-zip.sha256
          fi
          git config user.name "mevix-probe-bot"
          git config user.email "mevix-probe-bot@users.noreply.github.com"
          git add probe-results/mev-818-rn0871
          if ! git diff --cached --quiet; then
            git commit -m "evidence: publish MEV-818 RN 0.87.1 probe readback"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Publish machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mev-818-rn0871-hosted-probe
          path: |
            out/MEV-818-rn0871-hosted-probe.zip
            out/mev-818-rn0871-probe/RESULT.json
            out/mev-818-rn0871-probe/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
