name: MEV-818 converged exact React Native Android build

on:
  push:
    branches:
      - transport/mev-818-product-build-20260925
    paths:
      - .github/workflows/mev-818-product-build.yml
      - .github/scripts/mev-818-product-build.sh
      - .github/scripts/mev-818-terminal-guard.sh
      - transport/mev-818-ui-native-source.tgz.b64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mev-818-product-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact execution carrier
        uses: actions/checkout@v4

      - name: Set up exact Node 24.3
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify embedded exact source carrier
        shell: bash
        run: |
          set -euo pipefail
          test -s transport/mev-818-ui-native-source.tgz.b64
          base64 -d transport/mev-818-ui-native-source.tgz.b64 > /tmp/mev-818-source.tgz
          echo 'a1ca235a330821353eee42b83da6f42683aa434bcb8697c558a9cf9eec1f4ed0  /tmp/mev-818-source.tgz' | sha256sum -c -

      - name: Materialize accepted Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -d "$SDK_ROOT/ndk/27.1.12297006"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Prepare converged exact source and first build contour
        shell: bash
        run: bash .github/scripts/mev-818-product-build.sh

      - name: Enforce terminal single-source qualification
        shell: bash
        run: bash .github/scripts/mev-818-terminal-guard.sh

      - name: Remove verified ephemeral compiler link and finalize evidence
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/.mev-818-converged-work/candidate"
          APP="$CANDIDATE/NativeNeutralApp"
          LINK="$CANDIDATE/library/packages/ui-native/node_modules"
          OUT="$GITHUB_WORKSPACE/out/mev-818-converged"

          STATUS_BEFORE="$(git -C "$CANDIDATE" status --short)"
          printf '%s\n' "$STATUS_BEFORE" > "$OUT/terminal-precleanup-status.txt"
          test "$STATUS_BEFORE" = '?? library/packages/ui-native/node_modules'
          test -L "$LINK"
          EXPECTED_TARGET="$(readlink -f "$APP/node_modules")"
          ACTUAL_TARGET="$(readlink -f "$LINK")"
          test "$ACTUAL_TARGET" = "$EXPECTED_TARGET"
          rm "$LINK"
          git -C "$CANDIDATE" status --short > "$OUT/terminal-source-status-after.txt"
          test ! -s "$OUT/terminal-source-status-after.txt"

          OUT="$OUT" LINK="$LINK" TARGET="$ACTUAL_TARGET" python3 - <<'PY'
          import json
          import os
          import pathlib

          out = pathlib.Path(os.environ['OUT'])
          result_path = out / 'RESULT.json'
          result = json.loads(result_path.read_text())
          steps = result.get('steps', {})
          if not steps or not all(value == 0 for value in steps.values()):
              raise SystemExit('NONZERO_TERMINAL_STEP')
          cleanup = {
              'schema': 'mevix.mev-818.ephemeral-link-cleanup.v1',
              'preCleanupStatus': '?? library/packages/ui-native/node_modules',
              'path': 'library/packages/ui-native/node_modules',
              'kind': 'symlink',
              'target': os.environ['TARGET'],
              'expectedTargetSuffix': '/NativeNeutralApp/node_modules',
              'postCleanupStatus': '',
          }
          if not cleanup['target'].endswith(cleanup['expectedTargetSuffix']):
              raise SystemExit('UNEXPECTED_LINK_TARGET')
          (out / 'terminal-ephemeral-link-cleanup.json').write_text(
              json.dumps(cleanup, indent=2, sort_keys=True) + '\n'
          )
          result['schema'] = 'mevix.mev-818-terminal-single-source-build.v3'
          result.setdefault('checks', {})['sourceCleanAfter'] = True
          result['checks']['ephemeralCompilerLinkRemoved'] = True
          result.setdefault('preparation', {})['postQualificationCleanup'] = cleanup
          result['status'] = (
              'PASS_MEV_818_TERMINAL_SINGLE_SOURCE_BUILD'
              if all(result['checks'].values()) else
              'FAIL_MEV_818_TERMINAL_SINGLE_SOURCE_BUILD'
          )
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          if result['status'] != 'PASS_MEV_818_TERMINAL_SINGLE_SOURCE_BUILD':
              raise SystemExit(result['status'])
          PY

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          python3 - <<'PY'
          import pathlib
          import zipfile
          root = pathlib.Path('out/mev-818-converged')
          target = pathlib.Path('out/MEV-818-converged-product-build.zip')
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root.parent))
          PY

      - name: Publish immutable terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mev-818-terminal-single-source-build
          path: |
            out/MEV-818-converged-product-build.zip
            out/mev-818-converged/RESULT.json
            out/mev-818-converged/SHA256SUMS
            out/mev-818-converged/NativeNeutralApp-terminal-debug.apk
            out/mev-818-converged/terminal-index.android.bundle
            out/mev-818-converged/MEV-818-terminal-source.bundle
            out/mev-818-converged/MEV-818-terminal-source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Enforce machine verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open('out/mev-818-converged/RESULT.json'))
          print(json.dumps(result, indent=2, sort_keys=True))
          raise SystemExit(0 if result['status'] == 'PASS_MEV_818_TERMINAL_SINGLE_SOURCE_BUILD' else 1)
          PY
