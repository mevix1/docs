name: MEV-818 strict installed React Native API typecheck

on:
  push:
    branches:
      - transport/mev-818-rn0871-package-20260925
    paths:
      - .github/workflows/mev-818-ui-native-typecheck.yml
      - transport/mev-818-ui-native-source.tgz.b64

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      - name: Restore exact source and apply bounded accepted repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          base64 -d transport/mev-818-ui-native-source.tgz.b64 > /tmp/mev-818-source.tgz
          echo 'a1ca235a330821353eee42b83da6f42683aa434bcb8697c558a9cf9eec1f4ed0  /tmp/mev-818-source.tgz' | sha256sum -c -
          tar -xzf /tmp/mev-818-source.tgz -C source
          python3 - <<'PY'
          import json, pathlib

          package = pathlib.Path('source/packages/ui-native/package.json')
          manifest = json.loads(package.read_text())
          if manifest['devDependencies'].get('typescript') != '5.8.3':
              raise SystemExit('UNEXPECTED_TYPESCRIPT_BASE')
          manifest['devDependencies']['typescript'] = '6.0.3'
          package.write_text(json.dumps(manifest, indent=2) + '\n')

          config = pathlib.Path('source/packages/ui-native/tsconfig.json')
          data = json.loads(config.read_text())
          if data.get('extends') != '@react-native/typescript-config/strict':
              raise SystemExit('UNEXPECTED_TYPESCRIPT_CONFIG_BASE')
          data['extends'] = '@react-native/typescript-config'
          data.setdefault('compilerOptions', {})['types'] = ['react']
          data['compilerOptions']['skipLibCheck'] = True
          config.write_text(json.dumps(data, indent=2) + '\n')

          binding = pathlib.Path('source/packages/ui-native/src/android/react-native-binding.tsx')
          text = binding.read_text()
          marker = "type StyleReference = Readonly<{\n  tokenRole: string;\n  binding: AndroidTokenBinding;\n}>;\n"
          if marker not in text:
              raise SystemExit('STYLE_REFERENCE_MARKER_MISSING')
          text = text.replace(marker, marker + "\ntype MutableStyle<T> = {-readonly [K in keyof T]: T[K]};\n")
          text = text.replace('  const result: TextStyle = {};', '  const result: MutableStyle<TextStyle> = {};')
          text = text.replace('  const result: ViewStyle = {};', '  const result: MutableStyle<ViewStyle> = {};')
          binding.write_text(text)
          PY
          echo 'e95e373ebbd583f6a71eb4b37da994bf83474c30105b96e54c70cc2ebd28747a  source/packages/ui-native/package.json' | sha256sum -c -
          echo '9c5dd963004c14cc8a09cd748a4a6db0048f59083c1cc98274f4bd0be75b2814  source/packages/ui-native/tsconfig.json' | sha256sum -c -
          echo '8b8b72fe8085230a35c2bc2562edda53a187d5886a0ebeaefd8b81c6e64c494e  source/packages/ui-native/src/android/react-native-binding.tsx' | sha256sum -c -

      - name: Install exact package graph
        working-directory: source/packages/ui-native
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --package-lock=true --audit=false --fund=false
          node - <<'NODE'
          const fs=require('node:fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const root=lock.packages[''];
          const rn=lock.packages['node_modules/react-native'];
          const react=lock.packages['node_modules/react'];
          const ts=lock.packages['node_modules/typescript'];
          if (root.devDependencies.typescript !== '6.0.3') throw new Error(`ROOT_TS:${root.devDependencies.typescript}`);
          if (rn.version !== '0.87.1') throw new Error(`RN_VERSION:${rn.version}`);
          if (react.version !== '19.2.3') throw new Error(`REACT_VERSION:${react.version}`);
          if (ts.version !== '6.0.3') throw new Error(`TS_VERSION:${ts.version}`);
          if (rn.resolved !== 'https://registry.npmjs.org/react-native/-/react-native-0.87.1.tgz') throw new Error(`RN_ORIGIN:${rn.resolved}`);
          console.log(JSON.stringify({root,rn:{version:rn.version,resolved:rn.resolved,integrity:rn.integrity},react:{version:react.version,resolved:react.resolved,integrity:react.integrity},typescript:{version:ts.version,resolved:ts.resolved,integrity:ts.integrity}},null,2));
          NODE

      - name: Strict public API typecheck
        working-directory: source/packages/ui-native
        shell: bash
        run: |
          set +e
          mkdir -p ../../../out
          ./node_modules/.bin/tsc -p tsconfig.json > ../../../out/TYPECHECK.log 2>&1
          status=$?
          echo "$status" > ../../../out/TYPECHECK.exit
          cat ../../../out/TYPECHECK.log
          exit "$status"
        continue-on-error: true

      - name: Build deterministic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp source/packages/ui-native/package-lock.json out/package-lock.json
          type_status="$(cat out/TYPECHECK.exit 2>/dev/null || printf 99)"
          sha256sum source/packages/ui-native/package.json source/packages/ui-native/package-lock.json \
            source/packages/ui-native/tsconfig.json \
            source/packages/ui-native/src/android/react-native-binding.tsx > out/SHA256SUMS
          TYPE_STATUS="$type_status" node - <<'NODE'
          const fs=require('node:fs'); const crypto=require('node:crypto');
          const lock=JSON.parse(fs.readFileSync('source/packages/ui-native/package-lock.json','utf8'));
          const typeStatus=Number(process.env.TYPE_STATUS);
          const receipt={
            schema:'mevix.mev-818-installed-api-typecheck.v2',
            status:typeStatus===0?'PASS_INSTALLED_REACT_NATIVE_STRICT_API':'FAIL_INSTALLED_REACT_NATIVE_STRICT_API',
            node:process.version,
            reactNative:lock.packages['node_modules/react-native'],
            react:lock.packages['node_modules/react'],
            typescript:lock.packages['node_modules/typescript'],
            sourceArchiveSha256:'a1ca235a330821353eee42b83da6f42683aa434bcb8697c558a9cf9eec1f4ed0',
            boundedRepairs:[
              'official @react-native/typescript-config root',
              'official React Native 0.87.1 TypeScript 6.0.3 toolchain',
              'explicit library ambient types [react]',
              'upstream declarations use official skipLibCheck policy',
              'mutable style builder before immutable StyleSheet registration'
            ],
            packageJsonSha256:crypto.createHash('sha256').update(fs.readFileSync('source/packages/ui-native/package.json')).digest('hex'),
            lockSha256:crypto.createHash('sha256').update(fs.readFileSync('source/packages/ui-native/package-lock.json')).digest('hex'),
            tsconfigSha256:crypto.createHash('sha256').update(fs.readFileSync('source/packages/ui-native/tsconfig.json')).digest('hex'),
            bindingSha256:crypto.createHash('sha256').update(fs.readFileSync('source/packages/ui-native/src/android/react-native-binding.tsx')).digest('hex'),
            typecheckExit:typeStatus,
            androidBuild:'NOT_RUN',
            emulatorDevice:'NOT_RUN'
          };
          fs.writeFileSync('out/RESULT.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            -czf MEV-818-installed-react-native-strict-api-typecheck.tgz -C out .
          sha256sum MEV-818-installed-react-native-strict-api-typecheck.tgz

      - name: Upload exact installed API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mev-818-installed-react-native-strict-api-typecheck
          path: MEV-818-installed-react-native-strict-api-typecheck.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Enforce typecheck result
        shell: bash
        run: |
          status="$(cat out/TYPECHECK.exit)"
          if [ "$status" -ne 0 ]; then
            echo "FAIL_INSTALLED_REACT_NATIVE_STRICT_API:$status" >&2
            exit "$status"
          fi
          echo PASS_INSTALLED_REACT_NATIVE_STRICT_API
